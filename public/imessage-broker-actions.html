<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iMessage Hermes Broker</title>
    <meta name="description" content="Hermes-verified iMessage messaging surface for Rabbit r1." />
    <style>
      :root {
        color-scheme: dark;
        background: #07090d;
        color: #f8fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #07090d;
      }

      main {
        width: min(100%, 540px);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 4;
        padding: 14px;
        background: rgba(7, 9, 13, 0.96);
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .top-row,
      .composer-actions,
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
      }

      .toolbar {
        grid-template-columns: repeat(3, 1fr);
        margin-top: 10px;
      }

      .status-strip {
        margin-top: 10px;
        border: 1px solid rgba(91, 214, 181, 0.32);
        border-radius: 8px;
        background: rgba(91, 214, 181, 0.1);
        padding: 9px 10px;
      }

      .status-line {
        margin: 0;
        color: #ffffff;
        font-size: 13px;
        font-weight: 850;
      }

      .request-line {
        margin: 3px 0 0;
        color: #bfd0dd;
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      button,
      input,
      textarea {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: #f8fbff;
        font: inherit;
      }

      button {
        min-height: 42px;
        padding: 10px 12px;
        background: #fe5000;
        color: #ffffff;
        font-weight: 850;
      }

      button.icon {
        width: 46px;
        padding: 0;
        font-size: 20px;
      }

      button.secondary {
        background: rgba(143, 230, 255, 0.14);
      }

      button.ghost {
        background: rgba(255, 255, 255, 0.08);
      }

      button:disabled {
        opacity: 0.55;
      }

      input,
      textarea {
        width: 100%;
        padding: 11px;
      }

      textarea {
        min-height: 70px;
        resize: vertical;
      }

      .search {
        padding: 10px 14px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .suggestions {
        display: none;
        max-height: 210px;
        overflow: auto;
        margin-top: 8px;
        border: 1px solid rgba(143, 230, 255, 0.22);
        border-radius: 8px;
        background: rgba(12, 18, 25, 0.98);
      }

      .suggestions.visible {
        display: block;
      }

      .contact-option,
      .thread {
        width: 100%;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin: 0;
        border: 0;
        border-radius: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        background: transparent;
        text-align: left;
      }

      .contact-option {
        padding: 10px;
      }

      .contact-name,
      .thread-name,
      .composer-target {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 850;
      }

      .contact-handle,
      .thread-preview,
      .thread-time,
      .empty,
      .thread-handle {
        color: #b8c7d8;
        font-size: 12px;
      }

      .contact-handle,
      .thread-preview {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .app-body {
        min-height: 0;
        display: grid;
        grid-template-columns: 42% 58%;
      }

      .threads,
      .conversation {
        min-height: 0;
        overflow: auto;
      }

      .threads {
        border-right: 1px solid rgba(255, 255, 255, 0.12);
      }

      .thread {
        padding: 12px 10px;
      }

      .thread.active {
        background: rgba(143, 230, 255, 0.12);
      }

      .conversation {
        padding: 12px 10px 96px;
      }

      .conversation-title {
        position: sticky;
        top: 0;
        z-index: 1;
        margin: -12px -10px 10px;
        padding: 10px;
        background: rgba(7, 9, 13, 0.94);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .conversation-title strong,
      .conversation-title span {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .conversation-title span {
        color: #b8c7d8;
        font-size: 12px;
      }

      .bubble {
        width: fit-content;
        max-width: 94%;
        margin: 0 0 8px;
        padding: 9px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.11);
        color: #f8fbff;
        overflow-wrap: anywhere;
        font-size: 14px;
        line-height: 1.35;
      }

      .bubble.sent {
        margin-left: auto;
        background: rgba(254, 80, 0, 0.9);
      }

      .bubble-meta {
        display: block;
        margin-top: 5px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 10px;
      }

      .composer {
        position: sticky;
        bottom: 0;
        z-index: 3;
        padding: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(7, 9, 13, 0.98);
      }

      .recipient-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin-bottom: 8px;
      }

      .empty {
        padding: 16px 12px;
        line-height: 1.4;
      }

      .error {
        color: #ffd2c2;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 430px) {
        main {
          grid-template-rows: auto auto minmax(260px, 1fr) auto;
        }

        .app-body {
          grid-template-columns: 1fr;
        }

        .threads {
          max-height: 240px;
          border-right: 0;
          border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="top-row">
          <h1>iMessage</h1>
          <button type="button" class="icon" data-action="refresh" title="Refresh messages" aria-label="Refresh messages">↻</button>
        </div>
        <div class="toolbar" aria-label="Message actions">
          <button type="button" class="secondary" data-action="refresh">Refresh</button>
          <button type="button" class="ghost" data-action="new">New</button>
          <button type="button" class="ghost" data-action="contacts">Contacts</button>
        </div>
        <div class="status-strip" aria-live="polite">
          <p id="statusLine" class="status-line">Status: ready</p>
          <p id="requestLine" class="request-line">Last request: none</p>
        </div>
      </header>

      <section class="search" aria-label="Contacts">
        <label class="sr-only" for="contactSearch">Search contacts</label>
        <input id="contactSearch" autocomplete="off" placeholder="Search contacts or enter phone/email" />
        <div id="suggestions" class="suggestions" aria-label="Contact suggestions"></div>
      </section>

      <section class="app-body" aria-label="Messages">
        <div id="threads" class="threads">
          <p class="empty">Tap refresh to load recent conversations.</p>
        </div>
        <div id="conversation" class="conversation">
          <p class="empty">Select a thread or search a contact to start.</p>
        </div>
      </section>

      <section class="composer" aria-label="Send message">
        <div class="recipient-row">
          <input id="recipient" autocomplete="off" placeholder="Recipient handle" />
          <button type="button" class="secondary" data-action="contacts">Find</button>
        </div>
        <label class="sr-only" for="message">Message</label>
        <textarea id="message" placeholder="Message"></textarea>
        <div class="composer-actions">
          <span id="selectedThread" class="composer-target">No thread selected</span>
          <button type="button" data-action="send">Send</button>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var hermesUrl = "https://michaels-macbook-pro.tailcfaeac.ts.net";
        var creationGateId = "b0ba279701768529048562f2c766e9d4";
        var creationGateKey = "29043089b8e62fd942f21d68762411e503bfcaba6d491844162e90516a7e783b";
        var threadsEl = document.getElementById("threads");
        var conversationEl = document.getElementById("conversation");
        var suggestionsEl = document.getElementById("suggestions");
        var statusLine = document.getElementById("statusLine");
        var requestLine = document.getElementById("requestLine");
        var contactSearch = document.getElementById("contactSearch");
        var recipient = document.getElementById("recipient");
        var message = document.getElementById("message");
        var selectedThread = document.getElementById("selectedThread");
        var threads = [];
        var activeThreadKey = "";
        var contactTimer = null;
        var requestCount = 0;

        function setStatus(status, detail) {
          statusLine.textContent = "Status: " + status;
          requestLine.textContent = "Last request: " + (detail || "none");
          statusLine.className = "status-line" + (status === "error" || status === "timeout" || status === "blocked" ? " error" : "");
        }

        function setBusy(isBusy) {
          requestCount += isBusy ? 1 : -1;
          if (requestCount < 0) {
            requestCount = 0;
          }
          Array.prototype.forEach.call(document.querySelectorAll("button"), function (button) {
            if (button.getAttribute("data-action") !== "new") {
              button.disabled = requestCount > 0;
            }
          });
        }

        function text(value) {
          return String(value == null ? "" : value);
        }

        function formatTime(value) {
          if (!value) {
            return "";
          }
          try {
            return new Date(value).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
          } catch (error) {
            return "";
          }
        }

        function latestMessage(thread) {
          var received = Array.isArray(thread.received) ? thread.received : [];
          var sent = Array.isArray(thread.sent) ? thread.sent : [];
          return received.concat(sent).sort(function (a, b) {
            return text(b.at).localeCompare(text(a.at));
          })[0] || null;
        }

        function threadKey(thread) {
          return thread.chatGuid || thread.chatIdentifier || thread.displayName || "";
        }

        function threadTitle(thread) {
          return thread.contactName || thread.displayName || thread.chatIdentifier || "Conversation";
        }

        function threadHandle(thread) {
          if (thread.contactMatchedHandle && thread.contactMatchedHandle !== threadTitle(thread)) {
            return thread.contactMatchedHandle;
          }
          if (thread.chatIdentifier && thread.chatIdentifier !== threadTitle(thread)) {
            return thread.chatIdentifier;
          }
          return "";
        }

        function requestJson(path, mode, body) {
          var verify = mode === "POST" ? "imessage.send" : "imessage.read";
          var gatedPath = path + (path.indexOf("?") === -1 ? "?" : "&") +
            "hv=" + encodeURIComponent(verify) +
            "&cid=" + encodeURIComponent(creationGateId) +
            "&cg=" + encodeURIComponent(creationGateKey);
          var controller = window.AbortController ? new AbortController() : null;
          var options = { method: mode || "GET" };
          if (controller) {
            options.signal = controller.signal;
          }
          if (mode === "POST") {
            options.headers = { "content-type": "text/plain" };
            options.body = JSON.stringify(body || {});
          }
          setStatus("requesting", path);
          setBusy(true);
          var timeoutPromise = new Promise(function (resolve) {
            setTimeout(function () {
              if (controller) {
                controller.abort();
              }
              resolve({ ok: false, error: "request_timeout", endpoint: hermesUrl + path });
            }, 12000);
          });
          var fetchPromise = fetch(hermesUrl + gatedPath, options).then(function (response) {
            return response.text().then(function (bodyText) {
              var payload;
              try {
                payload = bodyText ? JSON.parse(bodyText) : {};
              } catch (error) {
                payload = { raw: bodyText };
              }
              payload.httpStatus = response.status;
              setStatus(response.ok ? "ok" : "error", path + " HTTP " + response.status);
              return payload;
            });
          }).catch(function (error) {
            setStatus("error", path + " " + (error.name === "AbortError" ? "request_timeout" : "fetch_failed"));
            return { ok: false, error: error.name === "AbortError" ? "request_timeout" : "fetch_failed", message: error.message };
          });
          return Promise.race([fetchPromise, timeoutPromise]).then(function (payload) {
            if (payload && payload.error === "request_timeout") {
              setStatus("timeout", path);
            }
            setBusy(false);
            return payload;
          });
        }

        function renderThreads() {
          if (!threads.length) {
            threadsEl.innerHTML = '<p class="empty">No recent conversations returned.</p>';
            return;
          }
          threadsEl.innerHTML = "";
          threads.forEach(function (thread) {
            var latest = latestMessage(thread);
            var button = document.createElement("button");
            button.type = "button";
            button.className = "thread" + (threadKey(thread) === activeThreadKey ? " active" : "");
            button.innerHTML = '<span><span class="thread-name"></span><span class="thread-handle"></span><span class="thread-preview"></span></span><span class="thread-time"></span>';
            button.querySelector(".thread-name").textContent = threadTitle(thread);
            button.querySelector(".thread-handle").textContent = threadHandle(thread);
            button.querySelector(".thread-preview").textContent = latest ? (latest.direction === "sent" ? "You: " : "") + (latest.text || (latest.hasAttachments ? "Attachment" : "")) : "No preview";
            button.querySelector(".thread-time").textContent = latest ? formatTime(latest.at) : "";
            button.addEventListener("click", function () {
              selectThread(threadKey(thread));
            });
            threadsEl.appendChild(button);
          });
        }

        function renderConversation(thread) {
          if (!thread) {
            conversationEl.innerHTML = '<p class="empty">Select a thread or search a contact to start.</p>';
            selectedThread.textContent = "No thread selected";
            return;
          }
          var messages = (Array.isArray(thread.received) ? thread.received : [])
            .concat(Array.isArray(thread.sent) ? thread.sent : [])
            .sort(function (a, b) {
              return text(a.at).localeCompare(text(b.at));
            });
          conversationEl.innerHTML = "";
          var title = document.createElement("div");
          title.className = "conversation-title";
          title.innerHTML = "<strong></strong><span></span>";
          title.querySelector("strong").textContent = threadTitle(thread);
          title.querySelector("span").textContent = threadHandle(thread);
          conversationEl.appendChild(title);
          if (!messages.length) {
            var empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "No messages in this thread payload.";
            conversationEl.appendChild(empty);
          }
          messages.forEach(function (item) {
            var bubble = document.createElement("div");
            bubble.className = "bubble " + (item.direction === "sent" ? "sent" : "received");
            bubble.textContent = item.text || (item.hasAttachments ? "Attachment" : "");
            var meta = document.createElement("span");
            meta.className = "bubble-meta";
            meta.textContent = formatTime(item.at);
            bubble.appendChild(meta);
            conversationEl.appendChild(bubble);
          });
          selectedThread.textContent = threadTitle(thread);
          recipient.value = thread.contactMatchedHandle || thread.chatIdentifier || "";
          setTimeout(function () {
            conversationEl.scrollTop = conversationEl.scrollHeight;
          }, 0);
        }

        function selectThread(key) {
          activeThreadKey = key;
          var thread = threads.filter(function (candidate) {
            return threadKey(candidate) === key;
          })[0];
          renderThreads();
          renderConversation(thread);
        }

        function refreshThreads() {
          threadsEl.innerHTML = '<p class="empty">Refreshing conversations...</p>';
          return requestJson("/imessage/threads?threadLimit=15&perDirection=25").then(function (payload) {
            if (payload.error || (payload.httpStatus && payload.httpStatus >= 400)) {
              threadsEl.innerHTML = '<p class="empty error">Unable to load conversations.</p>';
              renderConversation(null);
              return;
            }
            threads = Array.isArray(payload.threads) ? payload.threads : [];
            renderThreads();
            if (activeThreadKey) {
              selectThread(activeThreadKey);
            } else if (threads[0]) {
              selectThread(threadKey(threads[0]));
            } else {
              renderConversation(null);
            }
          });
        }

        function renderContacts(payload) {
          var contacts = Array.isArray(payload.contacts) ? payload.contacts : [];
          suggestionsEl.innerHTML = "";
          if (!contacts.length) {
            suggestionsEl.innerHTML = '<p class="empty">No matching contacts.</p>';
            suggestionsEl.className = "suggestions visible";
            return;
          }
          contacts.forEach(function (contact) {
            (contact.handles || []).slice(0, 2).forEach(function (handle) {
              var option = document.createElement("button");
              option.type = "button";
              option.className = "contact-option";
              option.innerHTML = '<span><span class="contact-name"></span><span class="contact-handle"></span></span><span class="thread-time"></span>';
              option.querySelector(".contact-name").textContent = contact.displayName || handle.value;
              option.querySelector(".contact-handle").textContent = handle.value;
              option.querySelector(".thread-time").textContent = handle.type;
              option.addEventListener("click", function () {
                recipient.value = handle.value;
                selectedThread.textContent = contact.displayName || handle.value;
                activeThreadKey = "";
                renderThreads();
                conversationEl.innerHTML = '<p class="empty"></p>';
                conversationEl.querySelector(".empty").textContent = "Ready to message " + (contact.displayName || handle.value) + ".";
                suggestionsEl.className = "suggestions";
              });
              suggestionsEl.appendChild(option);
            });
          });
          suggestionsEl.className = "suggestions visible";
        }

        function searchContacts() {
          var query = contactSearch.value.trim();
          if (!query) {
            suggestionsEl.innerHTML = "";
            suggestionsEl.className = "suggestions";
            return Promise.resolve();
          }
          return requestJson("/imessage/contacts?q=" + encodeURIComponent(query) + "&limit=20").then(renderContacts);
        }

        function sendMessage() {
          if (!recipient.value.trim() || !message.value.trim()) {
            setStatus("blocked", "send missing recipient or message");
            return Promise.resolve();
          }
          return requestJson("/imessage/send", "POST", {
            recipient: recipient.value.trim(),
            message: message.value.trim()
          }).then(function (payload) {
            if (payload.status === "sent" || payload.messagesSent) {
              message.value = "";
              return refreshThreads();
            }
            setStatus("error", payload.error || payload.status || "send failed");
          });
        }

        function startNewMessage() {
          activeThreadKey = "";
          recipient.value = contactSearch.value.trim();
          message.value = "";
          selectedThread.textContent = "New message";
          suggestionsEl.className = "suggestions";
          renderThreads();
          renderConversation(null);
          recipient.focus();
        }

        Array.prototype.forEach.call(document.querySelectorAll('[data-action="refresh"]'), function (button) {
          button.addEventListener("click", refreshThreads);
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-action="contacts"]'), function (button) {
          button.addEventListener("click", searchContacts);
        });
        document.querySelector('[data-action="new"]').addEventListener("click", startNewMessage);
        document.querySelector('[data-action="send"]').addEventListener("click", sendMessage);
        contactSearch.addEventListener("input", function () {
          clearTimeout(contactTimer);
          contactTimer = setTimeout(searchContacts, 350);
        });

        refreshThreads();
      }());
    </script>
  </body>
</html>
